name: Decant
options:
  bundleIdPrefix: com.drewmanley
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: X9H68STU8F
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

targets:
  Decant:
    type: application
    platform: iOS
    sources:
      - path: Decant
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: Decant/Resources/Decant.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Decant/Resources/Info.plist
      properties:
        CFBundleDisplayName: Decant
        LSApplicationCategoryType: public.app-category.food-and-drink
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Decant uses the camera to scan wine labels and identify bottles.
        NSPhotoLibraryUsageDescription: Choose a photo of a wine label to identify it.
        NSPhotoLibraryAddUsageDescription: Save wine cards you create to your photo library.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewmanley.decant
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  DecantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DecantTests
    dependencies:
      - target: Decant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.drewmanley.decant.tests

schemes:
  Decant:
    build:
      targets:
        Decant: all
        DecantTests: [test]
    test:
      targets: [DecantTests]
